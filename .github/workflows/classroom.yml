name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  BASE_URL: ${{ vars.BASE_URL }}
  NAMESPACE: test

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run unit tests
        timeout-minutes: 10
        run: |
          cd v1
          mvn -B -q test

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        timeout-minutes: 20
        run: docker compose build

      - name: Push images
        timeout-minutes: 10
        run: docker compose push flight-service ticket-service bonus-service gateway

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy infrastructure
        timeout-minutes: 10
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "$NAMESPACE" -f k8s/postgres.yaml -f k8s/rabbitmq.yaml
          kubectl rollout status deployment/postgres -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/rabbitmq -n "$NAMESPACE" --timeout=180s

      - name: Deploy services
        timeout-minutes: 15
        run: |
          for service in flight-service ticket-service bonus-service gateway; do
            helm upgrade --install "$service" ./helm/rsoi-service -n "$NAMESPACE" \
              -f "helm-values/$service.yaml" \
              --set image.repository="$DOCKERHUB_USER/rsoi-$service" \
              --set image.tag="$IMAGE_TAG" \
              --wait --timeout 5m
          done

      - name: Wait before services are ready
        run: kubectl wait -n "$NAMESPACE" -l app.kubernetes.io/name=gateway pod --for=condition=Ready --timeout=3m

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        timeout-minutes: 10
        run: ./scripts/test-script.sh v1 bonus-service "$NAMESPACE"

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
